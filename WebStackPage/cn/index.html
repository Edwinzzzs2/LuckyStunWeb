    <script>
        // 强制刷新缓存并重载页面
        function hardRefresh() {
            console.log('正在刷新...');
            
            // 注销 Service Worker
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.getRegistration().then(function(reg) {
                    if (reg) {
                        reg.unregister().then(function() {
                            console.log('Service Worker 已注销');
                        });
                    }
                });
            }
            
            // 清除所有缓存
            if (window.caches) {
                caches.keys().then(function(keys) {
                    return Promise.all(keys.map(function(key) {
                        console.log('删除缓存:', key);
                        return caches.delete(key);
                    }));
                }).then(function() {
                    console.log('缓存清除完毕，刷新页面');
                    window.location.reload(true);
                }).catch(function(e) {
                    console.error('清除缓存出错:', e);
                    window.location.reload(true);
                });
            } else {
                window.location.reload(true);
            }
        }

        // 检查浏览器是否支持Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('../service-worker.js')
                    .then(function(registration) {
                        console.log('ServiceWorker 注册成功: ', registration.scope);
                        
                        // 检测Service Worker更新
                        registration.addEventListener('updatefound', function() {
                            console.log('检测到新的Service Worker版本');
                            const newWorker = registration.installing;
                            
                            newWorker.addEventListener('statechange', function() {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    console.log('新版本已安装，提示用户刷新');
                                    if (confirm('检测到新版本，是否立即刷新页面？')) {
                                        window.location.reload();
                                    }
                                }
                            });
                        });
                        
                        // 定期检查更新（每分钟检查一次）
                        setInterval(function() {
                            registration.update();
                        }, 60000);
                    })
                    .catch(function(error) {
                        console.log('ServiceWorker 注册失败: ', error);
                    });
                
                // 监听Service Worker控制器变化
                navigator.serviceWorker.addEventListener('controllerchange', function() {
                    console.log('Service Worker控制器已更改，重新加载页面');
                    window.location.reload();
                });
            });
        }
    </script>

    <script type="text/javascript">
        // 原有的平滑滚动和菜单交互逻辑保持不变
        $(document).ready(function () {
            //img lazy loaded
            const observer = lozad(); // Initialize Lozad
            // observer.observe(); // Observe after content is generated

            $('.user-info-menu .hidden-sm').click(function () {
                const action = $('.sidebar-menu').hasClass('collapsed') ? 'expand' : 'collapse';
                const actionName = action === 'expand' ? '展开' : '收起';
                
                // Umami事件跟踪 - 记录侧边栏切换
                if (typeof umami !== 'undefined') {
                    umami.track(`侧边栏${actionName}`, {
                        action: action,
                        action_name: actionName,
                        event_type: 'ui_interaction'
                    });
                }
                
                if ($('.sidebar-menu').hasClass('collapsed')) {
                    $('.has-sub.expanded > ul').attr("style", "")
                } else {
                    $('.has-sub.expanded > ul').show()
                }
            })
            // Modified selector for dynamic content
            $(document).on('click', "#main-menu li ul li", function () {
                $(this).siblings('li').removeClass('active'); // 删除其他兄弟元素的样式
                $(this).addClass('active'); // 添加当前元素的样式
            });
            // Modified selector for dynamic content
            $(document).on('click', "a.smooth", function (ev) {
                ev.preventDefault();

                // 获取导航标签信息用于Umami跟踪
                var navigationLabel = $(this).find('.title').text() || $(this).text().trim();
                var targetId = $(this).attr("href");
                
                // Umami事件跟踪 - 记录导航点击
                if (typeof umami !== 'undefined') {
                    umami.track(`导航跳转: ${navigationLabel}`, {
                        label: navigationLabel,
                        target: targetId,
                        category: $(this).closest('.has-sub').length > 0 ? 
                                 $(this).closest('.has-sub').find('> a .title').text() : 'top_level',
                        event_type: 'navigation_click'
                    });
                }
                
                // 安全地获取目标元素，处理包含特殊字符的ID
                var targetElement = null;
                try {
                    // 移除开头的 # 号
                    var elementId = targetId.substring(1);
                    // 使用 document.getElementById 避免 jQuery 选择器的特殊字符问题
                    targetElement = document.getElementById(elementId);
                } catch (e) {
                    console.warn("Error finding target element:", targetId, e);
                }
                
                // Ensure the target element exists before trying to scroll
                if (targetElement) {
                    public_vars.$mainMenu.add(public_vars.$sidebarProfile).toggleClass('mobile-is-visible');
                    ps_destroy(); // Assuming this function exists and handles PerfectScrollbar
                    $("html, body").animate({
                        scrollTop: $(targetElement).offset().top - 30
                    }, {
                        duration: 500,
                        easing: "swing"
                    });
                } else {
                    console.warn("Smooth scroll target not found:", targetId);
                }


                // Update active class for sidebar items
                $("#main-menu li").removeClass("active").removeClass("expanded").removeClass("opened"); // Reset all
                $(this).closest('li').addClass('active');

                // Handle parent menu item expansion and active state
                if ($(this).closest('ul').hasClass('sub-menu')) {
                    var parentLi = $(this).closest('li.has-sub');
                    parentLi.addClass('active').addClass('expanded').addClass('opened');
                    // Ensure parent ul is visible if menu is collapsed
                    if ($('.sidebar-menu').hasClass('collapsed')) {
                        parentLi.children('ul').show();
                    }
                } else {
                    $(this).closest('li').addClass('active');
                }


            });

            var $quickMenu = $('#quick-link-menu');
            var currentCard = null;

            function hideQuickMenu() {
                $quickMenu.hide();
                currentCard = null;
            }

            function showQuickMenu(card, pageX, pageY) {
                currentCard = card;
                var mainUrl = card.data('main-url');
                var internalUrl = card.data('internal-url');
                var backupUrl = card.data('backup-url');

                $quickMenu.find('li').each(function () {
                    var type = $(this).data('type');
                    var hasUrl = type === 'main' ? !!mainUrl :
                                 type === 'internal' ? !!internalUrl :
                                 !!backupUrl;
                    $(this).toggleClass('disabled', !hasUrl);
                });

                var menuWidth = $quickMenu.outerWidth();
                var menuHeight = $quickMenu.outerHeight();
                var winWidth = $(window).width();
                var winHeight = $(window).height();

                var left = pageX;
                var top = pageY;
                if (left + menuWidth > winWidth) {
                    left = winWidth - menuWidth - 8;
                }
                if (top + menuHeight > winHeight) {
                    top = winHeight - menuHeight - 8;
                }

                $quickMenu.css({ left: left, top: top }).show();
            }

            $(document).on('click', '.xe-widget', function (e) {
                if ($(e.target).closest('#quick-link-menu').length) {
                    return;
                }
                var $card = $(this);
                var targetUrl = $card.data('target-url');
                if (!targetUrl) {
                    return;
                }
                var title = $card.data('title') || '';
                var category = $card.data('category') || '';
                trackWebsiteClick(title, targetUrl, category);
                window.open(targetUrl, '_blank');
            });

            $(document).on('contextmenu', '.xe-widget', function (e) {
                e.preventDefault();
                e.stopPropagation();
                var $card = $(this);
                showQuickMenu($card, e.clientX, e.clientY);
            });

            $(document).on('click', '.xe-quick-btn, .xe-switch-btn', function (e) {
                e.preventDefault();
                e.stopPropagation();
                var $card = $(this).closest('.xe-widget');
                if (!$card.length) return;
                var rect = this.getBoundingClientRect();
                var pageX = rect.left + rect.width / 2;
                var pageY = rect.bottom;
                showQuickMenu($card, pageX, pageY);
            });

            $(document).on('click', '#quick-link-menu li', function (e) {
                e.stopPropagation();
                if (!currentCard) return;
                var $item = $(this);
                if ($item.hasClass('disabled')) return;

                var type = $item.data('type');
                var mainUrl = currentCard.data('main-url');
                var internalUrl = currentCard.data('internal-url');
                var backupUrl = currentCard.data('backup-url');

                var url = type === 'main' ? mainUrl :
                          type === 'internal' ? internalUrl :
                          backupUrl;
                if (!url) return;

                var title = currentCard.data('title') || '';
                var category = currentCard.data('category') || '';

                if (typeof umami !== 'undefined') {
                    umami.track('快捷链接点击', {
                        site_title: title,
                        site_url: url,
                        category: category,
                        link_type: type,
                        event_type: 'website_quick_link'
                    });
                }

                window.open(url, '_blank');
                hideQuickMenu();
            });

            $(document).on('click scroll', function (e) {
                if ($(e.target).closest('#quick-link-menu').length === 0) {
                    hideQuickMenu();
                }
            });

            function initializePage(data) {
                console.log('加载的数据:', data);
                generateSidebarMenu(data);
                generateMainContent(data);
                
                if (typeof setup_sidebar_menu === 'function') {
                   setup_sidebar_menu(); 
                } else {
                   console.warn('setup_sidebar_menu 函数未找到，请检查 xenon-custom.js');
                }

                observer.observe();

                if (window.xenonCustom && typeof window.xenonCustom.refresh === 'function') {
                    window.xenonCustom.refresh();
                }

                var handleResize = debounce(function() {
                    console.log('Window resized, refreshing Xenon layout...');
                    if (window.xenonCustom && typeof window.xenonCustom.refresh === 'function') {
                        window.xenonCustom.refresh();
                    }
                }, 250);

                $(window).on('resize', handleResize);
            }

            // 本地调试
            const isDev = true
            // 优先使用本地 data.js 数据
            if (typeof localData !== 'undefined' && localData && isDev) {
                console.log('使用本地 data.js 数据');
                initializePage(localData);
            } else {
                // 使用API获取数据
                fetch('/api/navigation')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('网络请求失败: ' + response.statusText);
                        }
                        return response.json();
                    })
                    .then(data => {
                        console.log('从API获取的数据:', data);
                        initializePage(data);
                    })
                    .catch(error => {
                        console.error('加载或处理数据时出错:', error);
                        $('#main-menu').html('<li><a href="#"><i class="linecons-alert"></i><span class="title">加载菜单失败</span></a></li>');
                        $('#main-content-wrapper').html('<p class="text-danger">加载内容失败: ' + error.message + '</p>');
                    });
            }
        }); // End document ready


        // --- Generation Functions ---

        function generateSidebarMenu(data) {
            const menuUl = $('#main-menu');
            let menuHtml = '';

            data.forEach(category => {
                if (category.children && category.children.length > 0) {
                    // Category with sub-menu
                    menuHtml += `<li class="has-sub">`;
                    menuHtml += `<a><i class="${category.icon}"></i><span class="title">${category.name}</span></a>`;
                    menuHtml += `<ul class="sub-menu">`; // Add sub-menu class
                    category.children.forEach(child => {
                        const cleanId = sanitizeId(child.name); // 清理ID
                        const childIcon = child.icon || category.icon || 'iconfont icon-link'; // 使用子项图标，或父级图标，或默认图标
                        menuHtml += `<li>`;
                        menuHtml += `<a href="#${cleanId}" class="smooth"><i class="${childIcon}"></i><span class="title">${child.name}</span>`;
                        if (child.is_hot) {
                            menuHtml += `<span class="label label-pink pull-right hidden-collapsed">Hot</span>`;
                        }
                        menuHtml += `</a></li>`;
                    });
                    menuHtml += `</ul></li>`;
                } else if (category.web && category.web.length > 0) {
                    // Top-level category without sub-menu
                    const cleanId = sanitizeId(category.name); // 清理ID
                    menuHtml += `<li>`;
                    menuHtml += `<a href="#${cleanId}" class="smooth"><i class="${category.icon}"></i><span class="title">${category.name}</span></a>`;
                    menuHtml += `</li>`;
                }
                // Add other top-level items like "About" if they are not in JSON
            });
            // Manually add the "About" link if it's not in the JSON data
            // menuHtml += `
            //     <li>
            //         <a href="about.html" class="smooth">
            //             <i class="iconfont icon-guanyu"></i>
            //             <span class="title">关于本站</span>
            //         </a>
            //     </li>`;


            menuUl.html(menuHtml);
            // Important: Re-run Xenon's sidebar setup after adding items
            // setup_sidebar_menu(); // Or the relevant function from xenon-custom.js
        }

        function generateMainContent(data) {
            const contentWrapper = $('#main-content-wrapper');
            let contentHtml = '';

            data.forEach(category => {
                // --- Generate Category/SubCategory Blocks ---
                if (category.children && category.children.length > 0) {
                    // Category with children - Iterate through children
                    category.children.forEach(child => {
                        contentHtml += generateCategorySection(child.name, child.icon || category.icon, child.web); // Use child icon or parent icon
                    });
                } else if (category.web && category.web.length > 0) {
                    // Top-level category with websites
                    contentHtml += generateCategorySection(category.name, category.icon, category.web);
                }
            });

            contentWrapper.html(contentHtml);
        }

        function generateCategorySection(categoryName, categoryIcon, websites) {
            if (!websites || websites.length === 0) return '';

            const lskyInternalBase = 'lsky'; // Lsky 内网基础地址
            
            // 清理categoryName作为有效的HTML ID
            const cleanId = sanitizeId(categoryName);

            let sectionHtml = `<h4 class="text-gray"><i class="${categoryIcon}" style="margin-right: 7px;" id="${cleanId}"></i>${categoryName}</h4>`;
            sectionHtml += '<div class="row">'; // Start the first row

            websites.forEach((site, index) => {
                // Close and start a new row every 4 items (except the first)
                if (index > 0 && index % 4 === 0) {
                    sectionHtml += '</div><div class="row">';
                }

                let logoSrc = site.logo;
                if (logoSrc && logoSrc.includes(lskyInternalBase)) { // 如果是内网 Lsky 地址，替换为反向代理路径
                    try {
                        logoSrc = new URL(logoSrc);
                    } catch (e) {
                        console.error("Error parsing Lsky URL:", logoSrc, e);
                    }

                } else if (logoSrc && !logoSrc.startsWith('http')) { // 如果不是 http 开头，则认为是相对于当前目录的父目录的相对路径
                    logoSrc = '../' + logoSrc;
                }
                // 如果已经是其他 http/https 地址 (非内网Lsky)，则保持不变

                // 根据 URL 类型选择合适的 URL
                let targetUrl = site.url;
                const urlType = getStoredUrlType();
                
                if (urlType === 'backup' && site.backup_url) {
                    targetUrl = site.backup_url;
                } else if (urlType === 'internal' && site.internal_url) {
                    targetUrl = site.internal_url;
                }

                // 更新网站链接的显示
                const siteLink = document.createElement('a');
                siteLink.href = targetUrl;
                siteLink.target = '_blank';
                siteLink.onclick = function(e) {
                    e.preventDefault();
                    window.open(targetUrl, '_blank');
                };
                siteLink.innerHTML = `
                    <div class="web-item">
                        <img src="${site.logo}" alt="${site.title}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZD0iTTEyIDJDNi40OCAyIDIgNi40OCAyIDEyczQuNDggMTAgMTAgMTAgMTAtNC40OCAxMC0xMFMxNy41MiAyIDEyIDJ6bTAgMThjLTQuNDEgMC04LTMuNTktOC04czMuNTktOCA4LTggOCAzLjU5IDggOC0zLjU5IDgtOCA4eiIvPjwvc3ZnPg=='">
                        <div class="web-info">
                            <h3>${site.title}</h3>
                            <p>${site.desc || ''}</p>
                            <div class="url-info">
                                <span class="url-type" data-type="${urlType}">${urlType === 'internal' ? '内网' : urlType === 'backup' ? '备用' : '外网'}</span>
                                <span class="url-text">${targetUrl}</span>
                            </div>
                        </div>
                    </div>
                `;

                sectionHtml += `
                    <div class="col-sm-3">
                        <div class="xe-widget xe-conversations box2 label-info"
                             data-title="${site.title}"
                             data-category="${categoryName}"
                             data-main-url="${site.url || ''}"
                             data-backup-url="${site.backup_url || ''}"
                             data-internal-url="${site.internal_url || ''}"
                             data-target-url="${targetUrl}"
                             data-toggle="tooltip" data-placement="bottom" title="${targetUrl}">
                             <button type="button" class="xe-switch-btn">
                                <span class="xe-quick-text">切换</span>
                             </button>
                            <div class="xe-comment-entry">
                                <a class="xe-user-img">
                                    ${logoSrc
                                        ? `<img data-src="${logoSrc}" class="lozad img-circle" width="40">`
                                        : `<img src="../assets/images/favicon.png" class="img-circle" width="40">`
                                    }
                                </a>
                                <div class="xe-comment">
                                    <div class="xe-comment-header">
                                        <a href="#" class="xe-user-name overflowClip_1">
                                            <strong>${site.title}</strong>
                                        </a>
                                    </div>
                                    <p class="overflowClip_2">${site.desc}</p>
                                </div>
                            </div>
                        </div>
                    </div>`;
            });

            sectionHtml += '</div><br />'; // Close the last row for this section and add break
            return sectionHtml;
        }

        // --- 防抖函数 (如上一步添加) ---
        function debounce(func, wait, immediate) {
            var timeout;
            return function() {
                var context = this, args = arguments;
                var later = function() {
                    timeout = null;
                    if (!immediate) func.apply(context, args);
                };
                var callNow = immediate && !timeout;
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
                if (callNow) func.apply(context, args);
            };
        };

        // ID清理函数 - 将包含特殊字符的字符串转换为有效的HTML ID
        function sanitizeId(str) {
            return str
                .replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_') // 将非字母数字和中文字符替换为下划线
                .replace(/^[^a-zA-Z\u4e00-\u9fa5]/, 'id_$&') // 如果开头不是字母或中文，添加id_前缀
                .replace(/_+/g, '_') // 将连续的下划线替换为单个下划线
                .replace(/^_|_$/g, ''); // 移除开头和结尾的下划线
        }

        // Umami网站点击跟踪函数
        function trackWebsiteClick(siteTitle, siteUrl, category) {
            if (typeof umami !== 'undefined') {
                // 使用网站名称作为事件名称，让活动日志更直观
                umami.track(`点击网站: ${siteTitle}`, {
                    site_title: siteTitle,
                    site_url: siteUrl,
                    category: category,
                    network_type: getStoredUrlType(),
                    event_type: 'website_click'
                });
            }
        }

        // Umami外部链接跟踪函数
        function trackExternalLink(linkName, linkUrl) {
            if (typeof umami !== 'undefined') {
                umami.track(`外部链接: ${linkName}`, {
                    link_name: linkName,
                    link_url: linkUrl,
                    event_type: 'external_link'
                });
            }
        }

        // 网络类型本地存储相关函数
        function getStoredUrlType() {
            return localStorage.getItem('url_type') || 'main';
        }

        function setStoredUrlType(type) {
            localStorage.setItem('url_type', type);
        }


        function switchNetworkType(type) {
            const currentType = getStoredUrlType();
            const typeNames = {
                'main': '外网',
                'backup': '备用',
                'internal': '内网'
            };
            
            // Umami事件跟踪 - 记录网络类型切换
            if (typeof umami !== 'undefined') {
                umami.track(`网络切换: ${typeNames[currentType]} → ${typeNames[type]}`, {
                    from: currentType,
                    to: type,
                    from_name: typeNames[currentType],
                    to_name: typeNames[type],
                    event_type: 'network_switch'
                });
            }
            
            setStoredUrlType(type);
            window.location.reload(); // 只刷新页面，不跳转参数
        }

        // 更新当前网络类型显示
        function updateNetworkTypeDisplay() {
            const urlType = getStoredUrlType();
            const displayText = urlType === 'internal' ? '内网' : urlType === 'backup' ? '备用' : '外网';
            // 修改按钮文字（保留图片）
            const btn = document.getElementById('current-network-type');
            if (btn) {
                // 只修改文本部分
                btn.textContent = ' ' + displayText;
            }
        }

        // 新增：根据url_type高亮active
        function updateNetworkTypeActive() {
            const urlType = getStoredUrlType();
            ['main', 'internal', 'backup'].forEach(type => {
                const li = document.getElementById('li-' + type);
                if (li) {
                    if (type === urlType) {
                        li.classList.add('active');
                    } else {
                        li.classList.remove('active');
                    }
                }
            });
        }
        document.addEventListener('DOMContentLoaded', function() {
            updateNetworkTypeDisplay();
            updateNetworkTypeActive();
        });

    </script>

    <script src="../assets/js/pwa-install.js"></script>

    <!-- 离线提示 -->
    <script>
        window.addEventListener('online', function() {
            document.body.classList.remove('offline');
            if(document.getElementById('offline-message')) {
                document.getElementById('offline-message').style.display = 'none';
            }
        });
        
        window.addEventListener('offline', function() {
            document.body.classList.add('offline');
            
            if(!document.getElementById('offline-message')) {
                const offlineMsg = document.createElement('div');
                offlineMsg.id = 'offline-message';
                offlineMsg.style.position = 'fixed';
                offlineMsg.style.top = '0';
                offlineMsg.style.left = '0';
                offlineMsg.style.right = '0';
                offlineMsg.style.backgroundColor = '#ff9800';
                offlineMsg.style.color = 'white';
                offlineMsg.style.padding = '10px';
                offlineMsg.style.textAlign = 'center';
                offlineMsg.style.zIndex = '10000';
                offlineMsg.innerHTML = '您当前处于离线状态，网站内容来自缓存';
                document.body.appendChild(offlineMsg);
            } else {
                document.getElementById('offline-message').style.display = 'block';
            }
        });
        
        // 检查初始网络状态
        if(!navigator.onLine) {
            window.dispatchEvent(new Event('offline'));
        }
    </script>
